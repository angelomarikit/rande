<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-rande.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rande Travel and Tours — Philippine travel agency since 2012. Domestic tours, resort packages, and international journeys planned with care."
    />
    <meta name="theme-color" content="#087A38" />

    <!-- Open Graph / Facebook / Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rande Travel and Tours" />
    <meta property="og:title" content="Rande Travel and Tours | Tara, Biyahe tayo!" />
    <meta
      property="og:description"
      content="DOT-accredited travel agency since 2012. Local & international tours, flight booking, van rental, and visa assistance — San Juan, Batangas."
    />
    <!-- After you deploy, replace with the full public URL, e.g. https://yourdomain.com/images/og-share.jpg -->
    <meta property="og:image" content="/images/og-share.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Rande Travel and Tours — Tara, Biyahe tayo! DOT-accredited since 2012" />
    <meta property="og:locale" content="en_PH" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rande Travel and Tours | Tara, Biyahe tayo!" />
    <meta
      name="twitter:description"
      content="DOT-accredited travel agency since 2012. Local & international tours, flight booking, van rental, and visa assistance."
    />
    <meta name="twitter:image" content="/images/og-share.jpg" />
    <meta name="twitter:image:alt" content="Rande Travel and Tours — Tara, Biyahe tayo!" />

    <link rel="image_src" href="/images/og-share.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Rande Travel and Tours | Adventures Since 2012</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
